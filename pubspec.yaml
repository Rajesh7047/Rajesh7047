name: fitmitra
description: Premium AI-powered health & wellness app by Epoint Digital.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State & architecture
  flutter_riverpod: ^2.6.1
  equatable: ^2.0.7

  # Navigation
  go_router: ^14.8.1

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.6
  firebase_storage: ^12.4.5

  # UI & UX
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.17
  pinput: ^5.0.1
  intl: ^0.20.2
  fl_chart: ^0.70.2

  # Media
  video_player: ^2.9.5
  chewie: ^1.11.1
  url_launcher: ^6.3.1

  # Payments & config
  razorpay_flutter: ^1.4.0
  flutter_dotenv: ^5.2.1

  # Storage & utils
  shared_preferences: ^2.5.3
  http: ^1.3.0
  uuid: ^4.5.1
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - .env.example
