name: fitmitra
description: Premium AI-powered health and wellness Flutter app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  cached_network_image: 3.4.1
  cloud_firestore: 6.4.1
  firebase_auth: 6.5.1
  firebase_core: 4.9.0
  firebase_storage: 13.4.1
  flutter_riverpod: 3.3.1
  go_router: 17.2.3
  google_generative_ai: 0.4.7
  intl: 0.20.2
  razorpay_flutter: 1.4.5
  url_launcher: 6.3.2
  video_player: 2.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
