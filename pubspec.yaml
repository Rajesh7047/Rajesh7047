name: fitmitra
description: Premium AI-powered health and wellness app.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: any
  flutter_riverpod: any
  go_router: any
  firebase_core: any
  firebase_auth: any
  cloud_firestore: any
  firebase_storage: any
  shared_preferences: any
  intl: any
  uuid: any
  razorpay_flutter: any
  dio: any
  flutter_animate: any
  youtube_player_iframe: any
  url_launcher: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/videos/
