name: fitmitra
description: "FitMitra - AI-powered Health & Wellness App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.3
  cloud_firestore: ^5.6.6
  firebase_storage: ^12.4.5
  firebase_messaging: ^15.2.5

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # UI & Design
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.3.1
  fl_chart: ^0.70.2
  smooth_page_indicator: ^1.2.0+3
  flutter_animate: ^4.5.2
  gap: ^3.0.1
  badges: ^3.1.2

  # Payments
  razorpay_flutter: ^1.3.6

  # Video
  youtube_player_flutter: ^9.1.1

  # HTTP & Network
  dio: ^5.8.0
  connectivity_plus: ^6.1.4

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.5.3

  # Utilities
  intl: ^0.20.2
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  permission_handler: ^11.4.0
  local_auth: ^2.3.0
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.1
  equatable: ^2.0.7
  dartz: ^0.10.1
  get_it: ^8.0.3
  injectable: ^2.6.2
  logger: ^2.5.0
  path_provider: ^2.1.5
  uuid: ^4.5.1
  cupertino_icons: ^1.0.8
  pinput: ^5.0.1
  country_code_picker: ^3.0.0
  percent_indicator: ^4.2.4
  flutter_rating_bar: ^4.0.1
  webview_flutter: ^4.11.0
  share_plus: ^10.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  injectable_generator: ^2.7.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/
