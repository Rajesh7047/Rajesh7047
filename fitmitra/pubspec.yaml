name: fitmitra
description: "FitMitra - Your AI-Powered Health & Wellness Companion"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.6
  firebase_storage: ^12.4.5

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.3.1
  flutter_animate: ^4.5.2
  percent_indicator: ^4.2.3
  fl_chart: ^0.70.2
  smooth_page_indicator: ^1.2.0+3

  # Video
  youtube_player_flutter: ^9.1.1
  url_launcher: ^6.3.1

  # Storage
  shared_preferences: ^2.3.5
  hive_flutter: ^1.1.0

  # Network
  http: ^1.3.0
  dio: ^5.7.0

  # Utils
  intl: ^0.19.0
  uuid: ^4.5.1
  pin_code_fields: ^8.0.1
  flutter_staggered_grid_view: ^0.7.0
  carousel_slider: ^5.0.0

  # Razorpay
  razorpay_flutter: ^1.3.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
