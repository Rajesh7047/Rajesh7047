<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PlayVerse Offline</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #070915;
        color: #f8fbff;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        background:
          radial-gradient(circle at 20% 20%, rgba(0, 224, 255, 0.22), transparent 24rem),
          radial-gradient(circle at 80% 30%, rgba(124, 92, 255, 0.2), transparent 28rem),
          #070915;
      }

      article {
        width: min(560px, calc(100% - 32px));
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 28px;
        padding: 32px;
        background: rgba(12, 17, 38, 0.82);
        box-shadow: 0 28px 80px rgba(0, 0, 0, 0.32);
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 8vw, 4rem);
        line-height: 0.95;
        letter-spacing: -0.06em;
      }

      p {
        margin: 0 0 24px;
        color: #b8c4e6;
        line-height: 1.7;
      }

      a {
        display: inline-flex;
        border-radius: 999px;
        padding: 14px 18px;
        color: #07101c;
        background: linear-gradient(135deg, #70f6ff, #a98bff);
        font-weight: 800;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <article>
      <h1>You are offline</h1>
      <p>
        PlayVerse is installed and ready, but the latest catalog and account data need a network connection.
        Reconnect to continue shopping, checking out, or downloading installers.
      </p>
      <a href="/">Retry PlayVerse</a>
    </article>
  </body>
</html>
